services:
  postgres:
    image: postgres:15
    container_name: allu-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: allu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ../backend/api
      dockerfile: Dockerfile
    container_name: allu-api
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/allu?schema=public
      PORT: 3000
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ../frontend/web
      dockerfile: Dockerfile
    container_name: allu-frontend
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:3000
    ports:
      - "3001:3000"

volumes:
  postgres_data:
